# Local / staging stack. Secrets below are development defaults — override every one via .env in any shared environment.
x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  MONGO_URL: mongodb://mongo:27017/certischolar
  REDIS_URL: redis://redis:6379
  QUEUE_DRIVER: bullmq
  OCR_SERVICE_URL: http://ocr:8000
  MALWARE_SCANNER: clamav
  CLAMAV_HOST: clamav
  STORAGE_DIR: /data/documents
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0000000000}
  PRESIGN_SECRET: ${PRESIGN_SECRET:-dev-only-presign-secret-change-me-00000}
  STORAGE_KEY: ${STORAGE_KEY:-ZGV2LW9ubHktc3RvcmFnZS1rZXktMzItYnl0ZXMhISE=}
  WEB_ORIGIN: http://localhost:3000

services:
  mongo:
    image: mongo:8.0
    volumes: [mongo:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, retries: 10 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10 }

  clamav:
    image: clamav/clamav:1.4
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, retries: 20, start_period: 120s }

  # Deployed and scaled separately from the Node services; has its own health check.
  ocr:
    build: ./services/ocr
    environment: { OCR_PROVIDER: tesseract, OCR_WORKERS: "2" }
    deploy: { replicas: 1 }

  api:
    build: ./apps/api
    environment: *api-env
    command: ["sh", "-c", "node dist/seed.js && node dist/server.js"]
    volumes: [documents:/data/documents]
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }

  # Fast queues: analysis, verification, evaluation, maintenance.
  worker:
    build: ./apps/api
    environment: { <<: *api-env, WORKER_QUEUES: "analysis,verification,evaluation,maintenance" }
    command: ["node", "dist/worker.js"]
    volumes: [documents:/data/documents]
    depends_on: { api: { condition: service_started } }

  # OCR queue on its own workers so a slow document never delays rule evaluation.
  worker-ocr:
    build: ./apps/api
    environment: { <<: *api-env, WORKER_QUEUES: "ocr" }
    command: ["node", "dist/worker.js"]
    volumes: [documents:/data/documents]
    depends_on: { api: { condition: service_started }, ocr: { condition: service_healthy } }

  web:
    build: { context: ./apps/web, args: { API_URL: http://api:4000 } }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo:
  redis:
  documents:
