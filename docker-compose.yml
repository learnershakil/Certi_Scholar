# Local / staging stack. All secrets and settings come from .env (create it with: node scripts/init-env.mjs).
# Only the wiring between containers is defined here.
x-api-env: &api-env
  MONGO_URL: mongodb://mongo:27017/certischolar
  REDIS_URL: redis://redis:6379
  QUEUE_DRIVER: bullmq
  OCR_SERVICE_URL: http://ocr:8000
  MALWARE_SCANNER: clamav
  CLAMAV_HOST: clamav
  STORAGE_DIR: /data/documents
  WEB_ORIGIN: http://localhost:3000

x-api-service: &api-service
  build: ./apps/api
  env_file: [.env]
  volumes: [documents:/data/documents]

services:
  mongo:
    image: mongo:8.0
    ports: ["27019:27017"]
    volumes: [mongo:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, retries: 10 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10 }

  clamav:
    image: clamav/clamav:1.4
    healthcheck: { test: ["CMD", "clamdcheck.sh"], interval: 30s, retries: 20, start_period: 120s }

  # Deployed and scaled separately from the Node services; has its own health check.
  ocr:
    build: ./services/ocr
    env_file: [.env]
    deploy: { replicas: 1 }

  api:
    <<: *api-service
    environment: *api-env
    command: ["sh", "-c", "node dist/seed.js && node dist/server.js"]
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }

  # Fast queues: analysis, verification, evaluation, maintenance.
  worker:
    <<: *api-service
    environment: { <<: *api-env, WORKER_QUEUES: "analysis,verification,evaluation,maintenance" }
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on: { api: { condition: service_started } }

  # OCR queue on its own workers so a slow document never delays rule evaluation.
  worker-ocr:
    <<: *api-service
    environment: { <<: *api-env, WORKER_QUEUES: "ocr" }
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on: { api: { condition: service_started }, ocr: { condition: service_healthy } }

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_DEMO_ACCOUNTS: ${NEXT_PUBLIC_DEMO_ACCOUNTS:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo:
  redis:
  documents:
